services:
  # ---------- messaging / data infrastructure ----------
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports: ["1883:1883"] # MQTT (edge -> fog)
    restart: on-failure

  kafka:
    image: apache/kafka:3.8.0 # single node, KRaft mode (no Zookeeper = lighter)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    restart: on-failure

  redis:
    image: redis:7
    restart: on-failure

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: citypulse
      POSTGRES_PASSWORD: citypulse
      POSTGRES_DB: citypulse
    volumes: [pg-data:/var/lib/postgresql/data]
    restart: on-failure

  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    restart: on-failure

  # ---------- EDGE layer: simulated sensors ----------
  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mosquitto
    depends_on: [mosquitto]
    restart: on-failure

  # ---------- FOG layer: one node per city zone ----------
  fog-a:
    build: ./fog
    environment:
      { ZONE: A, MQTT_HOST: mosquitto, KAFKA_BOOTSTRAP: "kafka:9092" }
    depends_on: [mosquitto, kafka]
    restart: on-failure
  fog-b:
    build: ./fog
    environment:
      { ZONE: B, MQTT_HOST: mosquitto, KAFKA_BOOTSTRAP: "kafka:9092" }
    depends_on: [mosquitto, kafka]
    restart: on-failure
  fog-c:
    build: ./fog
    environment:
      { ZONE: C, MQTT_HOST: mosquitto, KAFKA_BOOTSTRAP: "kafka:9092" }
    depends_on: [mosquitto, kafka]
    restart: on-failure

  # ---------- CLOUD layer ----------
  processor: # scale with: docker-compose up -d --scale processor=3
    build: ./processor
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      DATABASE_URL: postgresql://citypulse:citypulse@postgres:5432/citypulse
      REDIS_HOST: redis
      MONGO_URL: mongodb://mongo:27017
    depends_on: [kafka, postgres, redis, mongo]
    restart: on-failure

  predictor: # predictive analytics: forecasts trends, raises early warnings
    build: ./predictor
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      REDIS_HOST: redis
    depends_on: [kafka, redis]
    restart: on-failure

  notifier: # consumes alerts.events, stores alerts, sends notifications
    build: ./notifier
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      REDIS_HOST: redis
      MONGO_URL: mongodb://mongo:27017
      ALERT_EMAIL: ${ALERT_EMAIL:-ops@citypulse.local}
      ALERT_PHONE: ${ALERT_PHONE:-+91-90000-00000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      MSG91_AUTHKEY: ${MSG91_AUTHKEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_API_URL: ${MSG91_API_URL:-https://control.msg91.com/api/v5/flow}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-9190465938:AAFkdGGBDvIhvFM_xMm9ShM6eYGn2GJ-w1U}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-5740904150}
    depends_on: [kafka, redis, mongo]
    restart: on-failure

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://citypulse:citypulse@postgres:5432/citypulse
      REDIS_HOST: redis
      MONGO_URL: mongodb://mongo:27017
      MQTT_HOST: mosquitto
      KAFKA_BOOTSTRAP: "kafka:9092"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CityPulse@123}
      JWT_SECRET: ${JWT_SECRET:-citypulse-development-secret-change-me}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-28800}
    depends_on: [postgres, redis, mongo, mosquitto]
    ports: ["8001:8000"] # Swagger docs at http://localhost:8001/docs
    restart: on-failure

  dashboard:
    build: ./dashboard
    ports: ["8080:80"]
    depends_on: [api]
    restart: on-failure

volumes:
  pg-data:
  mongo-data:
